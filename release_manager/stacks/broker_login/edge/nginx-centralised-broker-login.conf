# login.beonedge.in -> the broker login service on 127.0.0.1:47440.
# Installed by hand with sudo as /etc/nginx/sites-available/centralised-broker-login;
# see docs/manual/deployment.md, step 1. cloudflared sends this host to localhost:80
# like every other beonedge.in site, and this vhost picks it out by name.

server {
    listen 80;
    listen [::]:80;

    server_name login.beonedge.in;

    # Only cloudflared, on this box, may come through here. The app trusts the
    # identity header Cloudflare Access adds, so a request from the LAN or a port
    # forward carrying a forged one must never reach it.
    allow 127.0.0.1;
    allow ::1;
    deny all;

    access_log /var/log/nginx/centralised-broker-login.access.log;
    error_log  /var/log/nginx/centralised-broker-login.error.log warn;

    client_max_body_size 16k;

    location / {
        proxy_pass http://127.0.0.1:47440;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # The dashboard's live view is a server-sent event stream.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Dhan's redirect carries a one-time tokenId in the query string: keep it out
    # of the access log.
    location /dhan/ {
        access_log off;
        proxy_pass http://127.0.0.1:47440;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
